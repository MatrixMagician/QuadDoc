# goreleaser configuration for QuadDoc.
#
# CGO is off so the binaries are genuinely static and run on any glibc or musl
# system, which matters because the people who most need this tool are often
# working on a machine they cannot install a toolchain on.
version: 2

# The project name defaults to the repository name, which is QuadDoc, but the
# binary and the install instructions both say quaddoc. Pinning it keeps the
# archive names lowercase and consistent with what the README tells people to
# download.
project_name: quaddoc

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: quaddoc
    main: ./cmd/quaddoc
    binary: quaddoc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: quaddoc
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - docs/rules.md
      - docs/adr/*

checksum:
  name_template: checksums.txt

changelog:
  # `sort: asc` orders alphabetically, which for a first release listed
  # "Initial commit" in the middle of the feature work. Grouping by area is
  # more useful to a reader than any ordering of a flat list.
  use: git
  groups:
    - title: Rules
      regexp: '(?i)rules?|QD\d'
      order: 0
    - title: Conversion and fixes
      regexp: "(?i)convert|fix engine|compose"
      order: 1
    - title: Output and integration
      regexp: "(?i)sarif|json|output|reference|doctor"
      order: 2
    - title: Correctness and validation
      regexp: "(?i)mutation|citation|review|verify"
      order: 3
    - title: Other
      order: 99
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Initial commit$"

release:
  footer: |
    ## Install

    Download the archive for your architecture, verify it, and put the binary
    on your path:

    ```sh
    VERSION={{ .Version }}
    ARCH=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
    BASE=https://github.com/MatrixMagician/QuadDoc/releases/download/v${VERSION}

    curl -fsSLO ${BASE}/quaddoc_${VERSION}_linux_${ARCH}.tar.gz
    curl -fsSLO ${BASE}/checksums.txt
    sha256sum --check --ignore-missing checksums.txt

    tar xzf quaddoc_${VERSION}_linux_${ARCH}.tar.gz quaddoc
    install -m755 quaddoc ~/.local/bin/quaddoc
    ```

    The binaries are statically linked with CGO disabled, so they run on any
    Linux distribution regardless of its libc. Nothing is required at runtime,
    not even podman: host-context checks read files and degrade gracefully when
    they are absent.

    Verify the install with:

    ```sh
    quaddoc doctor
    ```

    ## Verifying the units it generates

    QuadDoc's generated units are checked against Podman's own Quadlet
    generator, not only against golden files:

        QUADLET_UNIT_DIRS=units/ /usr/libexec/podman/quadlet -dryrun -user

    See the [rule reference](https://github.com/MatrixMagician/QuadDoc/blob/main/docs/rules.md)
    for what each check encodes and the documentation it cites.
