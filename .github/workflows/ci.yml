name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The Quadlet generator is the acceptance oracle for conversion and for
      # the fix engine.
      #
      # ubuntu-latest packages Podman 4.9, which is below the minimum this
      # project supports (ADR-0002) and lacks keys such as Pod=. The generator
      # and citation checks detect that and skip with a reason rather than
      # reporting the runner's age as a failure. Installing podman here still
      # earns its keep: it proves the skip path works and that nothing else
      # breaks when podman is present.
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Test against the real Quadlet generator
        run: |
          podman --version
          # ADR-0002 sets the minimum at Podman 5.0; keys such as Pod= do not
          # exist before it. A runner with an older podman skips these tests
          # with a reason rather than reporting failures that are really the
          # runner's age.
          go test -count=1 -run 'Generator' -v ./internal/generate/ ./internal/fix/ ./cmd/quaddoc/

      # A rule's citation is its licence to exist. If a quote drifts from the
      # manual page it names, the rule is folklore wearing a reference.
      - name: Verify rule citations against the manual pages
        run: |
          if man podman-systemd.unit >/dev/null 2>&1; then
            python3 scripts/check-citations.py
          else
            echo "::warning::podman-docs not installed; skipping citation verification"
          fi

      - name: Check the rule reference is up to date
        run: |
          go run ./cmd/quaddoc rules --markdown > /tmp/rules.md
          if ! diff -u docs/rules.md /tmp/rules.md; then
            echo "::error::docs/rules.md is stale; regenerate with 'quaddoc rules --markdown > docs/rules.md'"
            exit 1
          fi

      # Exercise the whole user journey, asserting the exit codes rather than
      # swallowing them. The fixture deliberately contains problems, so
      # convert reports translation notes (1) and lint reports errors (2);
      # after fixing, only judgement-call warnings remain (1). Checking the
      # codes is the point, since they are what CI users gate on.
      - name: Run the documented journey end to end
        run: |
          go build -o /tmp/quaddoc ./cmd/quaddoc

          run_expecting() {
            local expected="$1"; shift
            set +e
            "$@" >/dev/null 2>&1
            local actual=$?
            set -e
            if [ "$actual" -ne "$expected" ]; then
              echo "::error::$* exited $actual, expected $expected"
              return 1
            fi
            echo "ok: $* exited $expected"
          }

          run_expecting 1 /tmp/quaddoc convert testdata/fixtures/webstack/compose.yaml --out /tmp/units
          run_expecting 2 /tmp/quaddoc lint /tmp/units
          run_expecting 0 /tmp/quaddoc fix /tmp/units --write
          run_expecting 1 /tmp/quaddoc lint /tmp/units
          run_expecting 0 /tmp/quaddoc doctor
          run_expecting 0 /tmp/quaddoc rules

          # Fixing must be idempotent: a second run changes nothing.
          before=$(sha256sum /tmp/units/* | sha256sum)
          run_expecting 0 /tmp/quaddoc fix /tmp/units --write
          after=$(sha256sum /tmp/units/* | sha256sum)
          if [ "$before" != "$after" ]; then
            echo "::error::fix is not idempotent"
            exit 1
          fi
          echo "ok: fix is idempotent"

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/quaddoc
